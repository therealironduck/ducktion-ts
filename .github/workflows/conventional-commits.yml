name: Conventional Commits
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-me:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 3
    steps:
      - uses: dev-build-deploy/commit-me@d514fec15ea83c0643013c801a375893eb51a433 # v2.1.1
        with:
          update-labels: false
          include-commits: false
          token: ${{ secrets.GITHUB_TOKEN }}
